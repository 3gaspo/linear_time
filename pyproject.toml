[project]
name = "linear-time"
version = "0.1.0"
description = "Closed-form linear forecasting experiments on the TIME benchmark"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "datasets>=2.17,<4",
    "huggingface-hub>=0.24,<1",
    "gluonts==0.16.2",
    "hydra-core>=1.3,<2",
    "PyYAML>=6,<7",
]

[tool.uv]
package = false

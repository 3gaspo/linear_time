divergences:
  - No foundation models, checkpoint loaders, or quantile forecast interface.
  - Hydra point-forecast entry points live under src/scripts.
  - NMSE/relative-MSE scales use epsilon; MASE matches TIME with zero scale undefined.
  - MASE eligibility never defines support for the other point metrics.
  - Short-only TIME horizons are retained as the largest of three child grid horizons.
  - Moving-average residual and trend heads are jointly fitted with exact ridge.
  - Parent cross-project artifact reuse is prohibited.
  - Validation selects alpha on fit members; fitting remains train-only.
  - Effective L is capped at earliest-test history; validation starts at its first feasible origin.
  - Seed folders and across-seed sample SD exist only for user generalization.
  - Default tasks are semantic quantity panels with joint N*L to N*H ridge.
  - Reports consume exact launch manifests rather than scanning completed tasks.

# Calendar-scale Linear TIME grid: nine Cartesian L-H settings per dataset.
# Short/medium/long contexts target local cycle, intermediate history, and a
# long calendar span. Horizons target day/week/month at hourly resolution and
# analogous spans at other frequencies. TIME validation/test intervals remain
# fixed, so a desired horizon is capped at the shorter interval and the other
# two values are shortened when necessary. Native TIME tasks are composed
# separately and are not required to be cells of this analysis grid.
